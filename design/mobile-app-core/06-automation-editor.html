<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gentle Movil · Editar automatización</title>
<style>
  :root{
    --bg:#060407; --bg-sunken:#0a060c; --surface:#100A0F;
    --border:#563040; --border-strong:#7a4558;
    --text:#F6EFF3; --accent:#F095C8; --accent-hover:#FFB1DD; --accent-ink:#28121E;
    --accent-text:#FFB1DD; --deep-pink:#C96AA2;
    --warning:#F2B86D; --ok:#4fc58c; --danger:#FF718F;
    --code-bg:#0f0c12; --overlay:rgb(0 0 0 / 0.55);
    --accent-soft:rgb(240 149 200 / 0.12); --glow:0 10px 30px #f095c84d;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-bento:20px; --radius-pill:999px;
    --shadow:0 1px 0 rgb(255 255 255 / 0.03) inset, 0 18px 40px -18px rgb(0 0 0 / 0.6);
    --mono:"IosevkaTerm NF","Iosevka Term","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --muted:color-mix(in srgb, var(--text) 64%, transparent);
    --faint:color-mix(in srgb, var(--text) 52%, transparent);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;width:430px;height:932px;overflow:hidden;
    display:flex;flex-direction:column;
    color:var(--text);font:400 .9rem/1.5 var(--mono);letter-spacing:.01em;
    background:
      radial-gradient(120% 55% at 50% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p,figure,fieldset{margin:0}
  fieldset{border:0;padding:0;min-width:0}
  legend{padding:0}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  .meta{font-size:.7rem;color:var(--faint);line-height:1.45}
  .ico{width:15px;height:15px;flex:none}
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .appbar{flex:none;display:flex;align-items:center;gap:8px;padding:14px 16px 10px 8px}
  .appbar__title{flex:1;min-width:0}
  .screen-title{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{
    flex:none;width:44px;height:44px;display:grid;place-items:center;
    border-radius:var(--radius-pill);color:var(--muted);border:1px solid transparent;
  }
  .icon-btn:hover{color:var(--text);background:var(--bg-sunken)}
  .chip{
    display:inline-flex;align-items:center;gap:6px;flex:none;
    padding:4px 10px;border-radius:var(--radius-pill);
    border:1px solid var(--border);background:var(--surface);
    font-size:.7rem;line-height:1.2;color:var(--muted);white-space:nowrap;
  }
  .chip .ico{width:11px;height:11px}
  main{flex:1;min-height:0;overflow-y:auto;padding:2px 20px 24px;scrollbar-width:none}
  main::-webkit-scrollbar{width:0;height:0}
  .form{display:flex;flex-direction:column;gap:18px;margin-top:10px}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .label{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .label--sub{margin-top:4px}
  input[type="text"],textarea,select{
    width:100%;padding:11px 14px;
    border-radius:var(--radius-md);border:1px solid var(--border-strong);
    background:var(--bg-sunken);font-size:.8rem;line-height:1.5;
    transition:border-color .15s ease;
  }
  input[type="text"]{min-height:48px}
  input[type="text"]:hover,textarea:hover,select:hover{border-color:var(--deep-pink)}
  input[type="text"]:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[aria-invalid="true"]{border-color:var(--danger)}
  textarea{min-height:116px;resize:vertical}
  .segmented{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;
    padding:4px;border-radius:var(--radius-pill);
    border:1px solid var(--border);background:var(--bg-sunken);
  }
  .segmented button{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:40px;padding:0 8px;border-radius:var(--radius-pill);
    font-size:.75rem;color:var(--muted);white-space:nowrap;
    transition:background-color .15s ease,color .15s ease;
  }
  .segmented button:hover{color:var(--text);background:var(--surface)}
  .segmented button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
  .select-wrap{position:relative;display:flex;align-items:center}
  select{appearance:none;min-height:48px;padding-right:40px}
  .select-wrap .ico{position:absolute;right:14px;pointer-events:none;color:var(--muted)}
  .parse{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.7rem;color:var(--muted)}
  .parse .ico{color:var(--accent-text)}
  .parse strong{font-weight:600;color:var(--accent-text)}
  .error{
    display:flex;align-items:flex-start;gap:8px;padding:10px 12px;
    border-radius:var(--radius-md);
    border:1px solid color-mix(in srgb, var(--danger) 34%, transparent);
    background:color-mix(in srgb, var(--danger) 9%, var(--surface));
    font-size:.75rem;line-height:1.5;
  }
  .error .ico{color:var(--danger);margin-top:2px}
  .danger-link{
    display:inline-flex;align-items:center;gap:8px;min-height:44px;
    font-size:.75rem;color:var(--danger);align-self:flex-start;
  }
  .danger-link:hover{text-decoration:underline;text-underline-offset:3px}
  .savebar{
    flex:none;padding:12px 20px 0;
    border-top:1px solid var(--border);
    background:color-mix(in srgb, var(--bg-sunken) 92%, var(--bg));
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:50px;padding:0 18px;border-radius:var(--radius-pill);
    font-size:.8rem;font-weight:600;border:1px solid transparent;
    transition:background-color .15s ease,box-shadow .15s ease;
  }
  .btn--primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent)}
  .btn--primary:hover{background:var(--accent-hover);box-shadow:var(--glow)}
  .savebar .btn{width:100%}
  .home-bar{height:18px;display:grid;place-items:center}
  .home-bar span{width:120px;height:4px;border-radius:var(--radius-pill);background:var(--border-strong)}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
<div class="screen">
  <header class="appbar">
    <a class="icon-btn" href="05-automations.html" aria-label="Volver a automatizaciones">
      <svg class="ico" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <div class="appbar__title">
      <h1 class="screen-title">Editar automatización</h1>
      <p class="meta">PR review nocturno · se guarda en tu PC</p>
    </div>
    <span class="chip">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="8" y="6" width="3" height="12" rx="1"/><rect x="13" y="6" width="3" height="12" rx="1"/></svg>
      Pausada
    </span>
  </header>

  <main id="main">
    <form class="form" id="auto-form" action="#" method="post" novalidate>
      <div class="field">
        <label class="label" for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" value="PR review nocturno" autocomplete="off">
      </div>

      <fieldset class="field">
        <legend class="label">Programación</legend>
        <div class="segmented" role="group" aria-label="Tipo de programación">
          <button type="button" aria-pressed="false">Cron</button>
          <button type="button" aria-pressed="true">Natural</button>
        </div>
        <label class="label label--sub" for="horario">Horario</label>
        <input id="horario" name="horario" type="text" value="todos los días a las 08:30"
               aria-invalid="true" aria-describedby="horario-error" autocomplete="off">
        <p class="parse">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
          Próxima: <strong>mié 18 nov 08:30</strong>
          <span class="meta">· en 14 h</span>
        </p>
        <p class="error" id="horario-error" role="alert">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 3.5 19h17z"/><path d="M12 10v4M12 16.5h.01"/></svg>
          «Briefing diario» ya corre todos los días a las 08:30. Elegí otro horario o pausá esa automatización.
        </p>
      </fieldset>

      <div class="field">
        <label class="label" for="zona">Zona horaria</label>
        <div class="select-wrap">
          <select id="zona" name="zona">
            <option selected>America/Argentina/Buenos_Aires</option>
            <option>America/Sao_Paulo</option>
            <option>Europe/Madrid</option>
            <option>UTC</option>
          </select>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>

      <div class="field">
        <label class="label" for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" rows="5">Revisá los PRs abiertos en gentle-movil. Para cada uno: resumí el cambio, marcá riesgos de seguridad y dejá un comentario con el veredicto. No mergees nada sin aprobación.</textarea>
      </div>

      <button class="danger-link" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14M9.5 8V5.5h5V8M7 8l1 11h8l1-11"/></svg>
        Eliminar automatización
      </button>
    </form>
  </main>

  <footer class="savebar">
    <button class="btn btn--primary" type="submit" form="auto-form">Guardar cambios</button>
    <div class="home-bar" aria-hidden="true"><span></span></div>
  </footer>
</div>
</body>
</html>
