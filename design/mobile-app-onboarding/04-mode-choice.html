<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430, initial-scale=1">
<title>Gentle Movil · elegir modo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060407;
    --bg-sunken: #0a060c;
    --surface: #100A0F;
    --border: #563040;
    --border-strong: #7a4558;
    --text: #F6EFF3;
    --accent: #F095C8;
    --accent-hover: #FFB1DD;
    --accent-ink: #28121E;
    --accent-text: #FFB1DD;
    --deep-pink: #C96AA2;
    --warning: #F2B86D;
    --ok: #4fc58c;
    --danger: #FF718F;
    --code-bg: #0f0c12;
    --overlay: rgb(0 0 0 / 0.55);
    --accent-soft: rgb(240 149 200 / 0.12);
    --glow: 0 10px 30px #f095c84d;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-bento: 20px;
    --radius-pill: 999px;
    --shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 18px 40px -18px rgb(0 0 0 / 0.6);
    --mono: "IosevkaTerm NF", "Iosevka Term", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --ink-2: color-mix(in srgb, var(--text) 72%, transparent);
    --ink-3: color-mix(in srgb, var(--text) 56%, transparent);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    width: 430px;
    height: 932px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.95rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, p { margin: 0; }
  fieldset { margin: 0; padding: 0; border: 0; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  ::selection { background: var(--accent-soft); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .screen {
    display: flex;
    flex-direction: column;
    width: 430px;
    height: 932px;
    overflow: hidden;
    background:
      radial-gradient(color-mix(in srgb, var(--accent) 7%, transparent) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--bg);
  }

  /* ---- Barra superior ---- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 24px 12px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .pi {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--accent-soft);
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
  }

  .word { font-size: 0.8rem; font-weight: 650; color: var(--text); }
  .word span { color: var(--accent-text); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 26px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* ---- Contenido ---- */
  .content {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
    padding: 4px 24px 16px;
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  h1 {
    margin-top: 10px;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  .lede {
    margin-top: 10px;
    max-width: 36ch;
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--ink-2);
  }

  /* ---- Tarjetas de modo ---- */
  .modes { display: grid; gap: 12px; margin-top: 22px; }

  .mode { position: relative; display: block; }

  .mode input {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .card {
    display: grid;
    gap: 10px;
    min-height: 122px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-bento);
    background: var(--surface);
    transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
  }

  .mode:hover .card { border-color: var(--border-strong); }

  .mode input:checked + .card {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: var(--glow);
  }

  .mode input:focus-visible + .card {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card-top {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .icon {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-sunken);
    color: var(--accent-text);
  }
  .mode input:checked + .card .icon {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }

  .titles { display: grid; gap: 1px; min-width: 0; }

  .t {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .s {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .mode input:checked + .card .s { color: var(--accent-text); }

  .marker {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-pill);
    color: transparent;
  }

  .mode input:checked + .card .marker {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }

  .desc {
    display: block;
    padding-left: 48px;
    font-size: 0.78rem;
    line-height: 1.55;
    color: var(--ink-2);
  }
  .desc span { display: block; }
  .desc span + span { color: var(--ink-3); }

  /* ---- Dock ---- */
  .dock {
    display: grid;
    gap: 10px;
    padding: 14px 24px 28px;
    border-top: 1px solid var(--border);
    background: linear-gradient(to top, var(--bg) 82%, transparent);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 54px;
    padding: 0 20px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--glow);
    transition: background-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .cta:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .cta:active { transform: scale(0.985); }

  .fine {
    font-size: 0.68rem;
    line-height: 1.6;
    text-align: center;
    color: var(--ink-3);
  }
  .fine b { color: var(--ink-2); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="screen">

  <header class="bar">
    <div class="brand">
      <span class="pi" aria-hidden="true">π</span>
      <p class="word">gentle <span>movil</span></p>
    </div>
    <span class="chip">modo de uso</span>
  </header>

  <main class="content">
    <p class="eyebrow">último paso · 2 de 2</p>
    <h1>Elegí cómo usar Gentle Movil</h1>
    <p class="lede">Podés cambiarlo cuando quieras desde Ajustes, sin volver a emparejar.</p>

    <form>
      <fieldset class="modes">
        <legend class="sr-only">Modo de uso</legend>

        <label class="mode">
          <input type="radio" name="mode" value="connected">
          <span class="card">
            <span class="card-top">
              <span class="icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18">
                  <rect x="1.6" y="2.6" width="14.8" height="9.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M9 12.2v2.6M5.6 15.4h6.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M4.6 6.4l1.6 1.6-1.6 1.6M8.2 9.6h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="titles">
                <span class="t">Conectado</span>
                <span class="s">controlá tu PC</span>
              </span>
              <span class="marker" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.4 4.6 9 10 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </span>
            </span>
            <span class="desc">
              <span>Sesiones, automatizaciones y CLI.</span>
              <span>Tu PC encendida con SSH activo.</span>
            </span>
          </span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="local">
          <span class="card">
            <span class="card-top">
              <span class="icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18">
                  <rect x="4.4" y="1.6" width="9.2" height="14.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M7.4 6.2 6 7.8l1.4 1.6M10.6 6.2 12 7.8l-1.4 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M8 13.4h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="titles">
                <span class="t">Local</span>
                <span class="s">desarrollá en el móvil</span>
              </span>
              <span class="marker" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.4 4.6 9 10 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </span>
            </span>
            <span class="desc">
              <span>Editor, agente y git en el teléfono.</span>
              <span>Funciona sin PC, incluso sin red.</span>
            </span>
          </span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="both" checked>
          <span class="card">
            <span class="card-top">
              <span class="icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 18 18">
                  <rect x="1.4" y="3.4" width="7" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                  <rect x="10.4" y="9.4" width="6.2" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M9.6 6.2h2.2v2M8.4 11.8H6.2v-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="titles">
                <span class="t">Ambos</span>
                <span class="s">elegido · conectado + local</span>
              </span>
              <span class="marker" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.4 4.6 9 10 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </span>
            </span>
            <span class="desc">
              <span>Conectado cerca de tu PC, o local.</span>
              <span>El repo se sincroniza al volver.</span>
            </span>
          </span>
        </label>
      </fieldset>
    </form>
  </main>

  <footer class="dock">
    <button class="cta" type="button">
      Continuar
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2.5 8h7M7 4.5 10.5 8 7 11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="fine">
      El modo local incluye editor, agente y git — sin compiladores ni toolchains en el móvil.
      <b>Todo queda en tu dispositivo.</b>
    </p>
  </footer>

</div>
</body>
</html>
