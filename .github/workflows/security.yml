name: Security

# Security and supply-chain gates for Gentle Movil.
#
# Three independent gates, each of which fails the workflow on a real finding:
#   * secrets      — gitleaks over the full git history (a key removed in a later
#                    commit is still a leaked key).
#   * dependencies — Trivy on the committed lockfiles (`mobile/package-lock.json`,
#                    `mobile-core/Cargo.lock`) plus a CycloneDX SBOM artefact.
#                    Fails on HIGH/CRITICAL, fixed or not.
#   * dependency-review — per-PR diff of dependency changes, fails on HIGH.
#
# Honesty rules applied here: no `|| true`, no `continue-on-error`, and no job that
# only echoes. `if: always()` is used only for SARIF/artefact uploads, which publish
# evidence *in addition to* the failing scan step, never instead of it. Nothing in
# this workflow builds the app: the APK (Rust + `expo prebuild` + gradle) and the
# downloaded Termux runtime are out of scope and are not verified here.
#
# GitHub platform constraint (deliberately not faked): on a PRIVATE repository,
# code-scanning SARIF upload and `dependency-review-action` require GitHub Code
# Security / Advanced Security (GHAS). This repo is private, so by default those two
# steps are skipped to avoid a permanently red run caused by licensing rather than by
# a finding. The enforced gates do not depend on GHAS: gitleaks (history) and Trivy
# (lockfiles, including on every PR) run and fail on their own, and both still publish
# their SARIF as a workflow artefact. Once GHAS/Code Security is available, set the
# repository variable `ADVANCED_SECURITY=enabled` to switch on dependency review and
# Security-tab upload; public repositories get them automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan, so a CVE published against an already-merged dependency
    # surfaces without waiting for the next push.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Least privilege at the workflow level: read-only repository access. The two jobs
# that publish SARIF escalate `security-events: write` on themselves.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: secrets in the git history.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed only for the SARIF upload; the scan itself is read-only.
      security-events: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4 # v4.2.2
        with:
          # A credential committed and later removed must still be caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Keep the upstream file name: `sha256sum --check` verifies by the name
          # recorded in the release's checksums file.
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/gitleaks_checksums.txt" \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" "${RUNNER_TEMP}/gitleaks_checksums.txt" \
            > "${RUNNER_TEMP}/gitleaks.sha256"
          test -s "${RUNNER_TEMP}/gitleaks.sha256"
          (cd "${RUNNER_TEMP}" && sha256sum --check --strict gitleaks.sha256)
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # Rule set and allowlist live in .gitleaks.toml: upstream rules stay enabled and
      # only generated trees plus Rust assertions on the OpenSSH header *text* are
      # allowed (no path that could hide a real key or token).
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          mkdir -p .security-reports
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --report-format sarif \
            --report-path .security-reports/gitleaks.sarif \
            --exit-code 1

      # Evidence for fork PRs, where the token cannot write to the Security tab.
      # Not a gate: the scan step above already failed the job.
      - name: Upload gitleaks report (artefact)
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: gitleaks-sarif
          path: .security-reports/gitleaks.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gitleaks findings (SARIF to code scanning)
        # Fork PRs get a read-only token, so `security-events: write` is refused;
        # uploading anyway would fail the job for a permissions reason unrelated to
        # any finding. The scan step remains the gate in that case.
        # Requires code scanning (GHAS on private repos) and, for fork PRs, a token
        # that is allowed to write security events. See the note at the top of the file.
        if: >-
          always() && !cancelled() &&
          (github.event.repository.private == false || vars.ADVANCED_SECURITY == 'enabled') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3 # v3.28.x
        with:
          sarif_file: .security-reports/gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Gate 2: vulnerable dependencies (PR diff).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review (pull requests)
    # `dependency-review-action` needs the dependency-review API, which is a GHAS
    # feature on private repositories. The Trivy job below still gates every PR on
    # the full dependency graph, so no vulnerable bump can merge unnoticed.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.private == false || vars.ADVANCED_SECURITY == 'enabled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4 # v4.7.3
        with:
          # Same severity bar as the Trivy gate.
          fail-on-severity: high
          # No license gate: mobile-core is AGPL-3.0 by design and the Expo stack is
          # MIT/Apache-2.0; a license policy is a product decision, not a CI default.
          comment-summary-in-pr: never

  # ---------------------------------------------------------------------------
  # Gate 3: known CVEs in the committed dependency graph (push + weekly).
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency and SBOM scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed only for the SARIF upload.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2
        with:
          persist-credentials: false

      # Trivy's allowlist lives here rather than in a committed file so that every
      # suppression is reviewed in the workflow diff. Policy: an entry is a CVE ID or
      # package rule plus a one-line reason; it exists only for a finding that cannot
      # be fixed or that is not reachable in this project. The list starts empty.
      - name: Write the Trivy allowlist (minimal, documented)
        run: |
          set -euo pipefail
          mkdir -p .security-reports
          cat > "${RUNNER_TEMP}/trivyignore" <<'TRIVYIGNORE'
          # One entry per line: CVE-YYYY-NNNNN (optionally "exp:YYYY-MM-DD").
          # Lines starting with # are comments.
          #
          # Currently empty on purpose: no finding has been reviewed and justified yet.
          # Do not add an entry to make a red build green. Fix or bump the dependency;
          # if neither is possible, see the Trivy SARIF in the Security tab.

          TRIVYIGNORE

      # This is the gate. Table output keeps the finding visible in the job log.
      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          # Unfixed findings fail too: the project's policy is to know about them, not
          # to hide them behind `--ignore-unfixed`. Justify one with the allowlist.
          ignore-unfixed: "false"
          # Present only on a developer machine; CI checks out a clean tree.
          skip-dirs: "node_modules,mobile/android,mobile-core/target,mobile/modules/gentle-core/android/src/main/jniLibs,.security-reports"
          trivyignores: ${{ runner.temp }}/trivyignore
          cache: true

      - name: Trivy SARIF report
        # Runs even when the gate above failed, so the findings reach the Security tab.
        # It fails as well (exit-code 1): no scan step ever passes with a real finding.
        if: always() && !cancelled()
        uses: aquasecurity/trivy-action@0.28.0 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: .security-reports/trivy.sarif
          exit-code: "1"
          ignore-unfixed: "false"
          skip-dirs: "node_modules,mobile/android,mobile-core/target,mobile/modules/gentle-core/android/src/main/jniLibs,.security-reports"
          trivyignores: ${{ runner.temp }}/trivyignore
          cache: true

      - name: SBOM (CycloneDX)
        # Inventory, not an inventory-only gate: vulnerabilities still fail it, so a
        # broken dependency graph can never be published as a clean SBOM unnoticed.
        if: always() && !cancelled()
        uses: aquasecurity/trivy-action@0.28.0 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: cyclonedx
          output: .security-reports/sbom-cyclonedx.json
          exit-code: "1"
          ignore-unfixed: "false"
          skip-dirs: "node_modules,mobile/android,mobile-core/target,mobile/modules/gentle-core/android/src/main/jniLibs,.security-reports"
          trivyignores: ${{ runner.temp }}/trivyignore
          cache: true

      - name: Upload SBOM (CycloneDX artefact)
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: .security-reports/sbom-cyclonedx.json
          # The artefact is required evidence: a scan that produced no SBOM must not
          # look like a successful run with nothing to upload.
          if-no-files-found: error
          retention-days: 30

      - name: Upload Trivy findings (SARIF to code scanning)
        # Same GHAS/fork guard as the secrets job: the gate is the Trivy step itself.
        if: >-
          always() && !cancelled() &&
          (github.event.repository.private == false || vars.ADVANCED_SECURITY == 'enabled') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3 # v3.28.x
        with:
          sarif_file: .security-reports/trivy.sarif
          category: trivy
