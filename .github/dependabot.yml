# Dependabot: keep every dependency surface of this repo current, weekly and grouped.
#
# Surfaces: the host CLI (root npm package, no runtime deps but still a manifest),
# the Expo app (mobile/), the local Expo module (mobile/modules/gentle-core) which has
# its own package.json, the Rust crate (mobile-core/, Cargo.lock is committed), and the
# GitHub Actions used by the workflows.
#
# `mobile/android/` is generated by `expo prebuild` and is not listed: Gradle
# dependencies come from the Expo SDK, never from a manifest we maintain.
version: 2
updates:
  # --- npm -------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "deps(root)"
    groups:
      root-npm:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm", "mobile"]
    commit-message:
      prefix: "deps(mobile)"
    groups:
      # Expo pins the whole RN toolchain to one SDK line: upgrading them together is
      # the only combination the Expo doctor/smoke path accepts.
      expo-sdk:
        applies-to: version-updates
        patterns: ["expo", "expo-*", "react-native", "react-native-*", "react"]
      mobile-other:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["expo", "expo-*", "react-native", "react-native-*", "react"]

  - package-ecosystem: "npm"
    directory: "/mobile/modules/gentle-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm", "mobile"]
    commit-message:
      prefix: "deps(gcore)"
    groups:
      gentle-core-npm:
        applies-to: version-updates
        patterns: ["*"]

  # --- cargo -----------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/mobile-core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps(core)"
    groups:
      # NOTE: several crates are held at exact versions to keep the declared
      # `rust-version = "1.75"` MSRV buildable (see the pins and their comments in
      # mobile-core/Cargo.toml). Grouped bumps still arrive, but CI for the crate is
      # the gate that decides whether the MSRV pins can move: never merge a bump that
      # raises the required toolchain without also editing Cargo.toml's pins.
      rust-deps:
        applies-to: version-updates
        patterns: ["*"]

  # --- github actions --------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
